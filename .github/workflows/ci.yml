name: CI

on:
  push:
    branches: [main]
  pull_request:
  # So a green badge can be re-established by hand after an infrastructure
  # wobble, without pushing an empty commit.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # A backtrace costs nothing here and turns "assertion failed" into something
  # you can act on without reproducing it locally.
  RUST_BACKTRACE: 1
  # The commands CI runs live in yatr.toml, so `yatr ci` locally is the same
  # gate. Bump deliberately.
  YATR_VERSION: "1.2.0"

concurrency:
  # A second push to the same branch makes the first run irrelevant.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - uses: Swatinem/rust-cache@v2

      - name: Cache yatr
        id: cache-yatr
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/yatr
          key: yatr-${{ runner.os }}-${{ env.YATR_VERSION }}

      # RUSTFLAGS is cleared so yatr, a different crate, does not inherit this
      # project's flags.
      - name: Install yatr
        if: steps.cache-yatr.outputs.cache-hit != 'true'
        run: cargo install yatr --version ${{ env.YATR_VERSION }} --locked
        env:
          RUSTFLAGS: ""

      - name: Formatting
        run: yatr fmt-check

      # Warnings are denied rather than printed: a warning nobody fails on is a
      # warning nobody reads.
      - name: Clippy
        run: yatr lint

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # One platform failing should not hide the result on the other.
      fail-fast: false
      matrix:
        include:
          # Linux carries ffmpeg, so the transcoding tests actually run here.
          - os: ubuntu-latest
            ffmpeg: true
          # macOS is where this is developed, and it is worth knowing the rest
          # still passes there. ffmpeg is left out on purpose: Homebrew takes
          # several minutes to build it, and the transcode tests skip
          # themselves when it is absent, which is exactly the behaviour a user
          # without ffmpeg gets.
          - os: macos-latest
            ffmpeg: false
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2

      - name: Cache yatr
        id: cache-yatr
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/yatr
          key: yatr-${{ runner.os }}-${{ env.YATR_VERSION }}

      # RUSTFLAGS is cleared so yatr, a different crate, does not inherit this
      # project's flags.
      - name: Install yatr
        if: steps.cache-yatr.outputs.cache-hit != 'true'
        run: cargo install yatr --version ${{ env.YATR_VERSION }} --locked
        env:
          RUSTFLAGS: ""

      - name: Install ffmpeg
        if: matrix.ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Report what is available
        run: |
          rustc --version
          ffmpeg -version 2>/dev/null | head -1 || echo "ffmpeg: absent (transcode tests will skip)"

      # --locked so a stale Cargo.lock is a failure rather than a silent
      # dependency bump. The suite is entirely offline: the tests that touch
      # archive.org are marked ignored and are not run here.
      - name: Test
        run: yatr test

  # Everything on this side of the wire. The search front end is TypeScript
  # talking to a relay over OIDC, and until this job existed nothing here looked
  # at it: a rename could break the whole site and CI would still be green,
  # because the failure did not arrive until Vercel tried to build it. The
  # player's own arithmetic is here too, for the same reason.
  javascript:
    name: javascript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      # yatr runs from the repository root: the task's own `cwd` puts it in
      # site/. The Rust toolchain on the runner image is enough to install it.
      - name: Cache yatr
        id: cache-yatr
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/yatr
          key: yatr-${{ runner.os }}-${{ env.YATR_VERSION }}

      - name: Install yatr
        if: steps.cache-yatr.outputs.cache-hit != 'true'
        run: cargo install yatr --version ${{ env.YATR_VERSION }} --locked
        env:
          RUSTFLAGS: ""

      # Each of these runs site-install first, which is `npm ci` rather than
      # `install`, so a lockfile that disagrees with package.json is a failure
      # rather than a silent upgrade.
      #
      # Types first: it is the faster of the two and its failures are the ones
      # that read clearly.
      - name: Types
        run: yatr site-types

      # The build needs no secrets. BALERION_PASSWORD and the relay settings
      # are read at request time, and a deployment missing them refuses
      # callers rather than failing to compile.
      - name: Build
        run: yatr site-build

      # The local player's own arithmetic, which lives apart from its DOM code
      # precisely so that it can be run without a browser. No dependencies and
      # no framework: `node --test` is in the runtime.
      - name: Player arithmetic
        run: yatr player-test

  # A single job to require in branch protection, so the required check does
  # not have to be renamed every time the matrix changes.
  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [check, test, javascript]
    if: always()
    steps:
      - name: Verify everything passed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "a required job did not pass"
            exit 1
          fi
          echo "all green"
